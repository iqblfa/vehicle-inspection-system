<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Inspection System - Daftar Akun</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-header">
                <h1 class="login-title">VINS</h1>
                <p class="login-subtitle">Daftar Akun Driver Baru</p>
            </div>

            <form id="formRegister" class="login-form">

                <div class="form-group">
                    <label for="inputNamaLengkap">Nama Lengkap</label>
                    <input type="text" id="inputNamaLengkap" placeholder="Nama sesuai KTP" required>
                </div>

                <div class="form-group">
                    <label for="inputEmailRegister">Email</label>
                    <input type="email" id="inputEmailRegister" placeholder="contoh@perusahaan.com" required>
                </div>

                <div class="form-group">
                    <label for="inputDepartemen">Departemen</label>
                    <input type="text" id="inputDepartemen" placeholder="Contoh: Operasional">
                </div>

                <div class="form-group">
                    <label for="inputPasswordRegister">Password</label>
                    <input type="password" id="inputPasswordRegister" placeholder="Minimal 6 karakter" required>
                </div>

                <div class="form-group">
                    <label for="inputKonfirmasiPassword">Konfirmasi Password</label>
                    <input type="password" id="inputKonfirmasiPassword" placeholder="Ulangi password" required>
                </div>

                <div id="registerError" class="error-message"></div>
                <div id="registerSuccess" class="success-message"></div>

                <button type="submit" class="btn-login">Daftar</button>

            </form>

            <p class="register-link">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
